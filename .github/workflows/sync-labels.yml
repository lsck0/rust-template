name: Sync Labels

on:
    workflow_dispatch:
    push:
        branches: [master]
        paths:
            - ".github/labels.yml"

permissions: {}

jobs:
    sync:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            issues: write
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: block
                  allowed-endpoints: >
                      github.com:443 api.github.com:443 release-assets.githubusercontent.com:443
                      objects.githubusercontent.com:443 results-receiver.actions.githubusercontent.com:443
                      *.blob.core.windows.net:443 *.githubapp.com:443

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Sync labels
              uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
              with:
                  config-file: .github/labels.yml
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
