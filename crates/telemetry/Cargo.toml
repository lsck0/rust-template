[package]
name = "telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["otlp", "profiling", "tls"]
otlp = ["dep:opentelemetry-appender-tracing", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
profiling = ["dep:pyroscope"]
tls = ["opentelemetry-otlp?/reqwest-rustls", "pyroscope?/rustls-tls"]

[dependencies]
macros.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
pyroscope = { workspace = true, optional = true }
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true

[[test]]
name = "export"
required-features = ["otlp", "profiling"]

[lints]
workspace = true
